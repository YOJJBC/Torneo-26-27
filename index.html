<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="balon.ico">
    <meta charset="UTF-8">

</head>

<body class="dark">

    <!-- HEADER -->
    <header>
        <!-- BOTÓN SOL/LUNA -->
        <button id="toggle-mode"></button>

        <h1>Temp. 26/27</h1>
    </header>

    <!-- MENÚ -->
    <nav>
        <button onclick="mostrarSeccion('calendario')">📅 Calendario</button>
        <button onclick="mostrarSeccion('jornadas')">🔢 Jornadas</button>
        <button onclick="mostrarSeccion('clasificacion')">📊 Clasificación</button>
        <button onclick="mostrarSeccion('resultados')">⚽ Resultados</button>
        <button onclick="mostrarSeccion('escrutador')">🧮 Escrutador</button>
    </nav>

    <!-- CONTENIDO -->
    <main>

        <!-- SECCIÓN CALENDARIO -->
        <div id="calendario" class="seccion">
            <h2>Calendario</h2>
            <p>Aquí irá el calendario del torneo.</p>
        </div>
<!-- SECCIÓN JORNADAS -->
<div id="jornadas" class="seccion">
 <section id="jornadas">

    <!-- BUSCADOR DE JORNADA BONITO -->
    <div class="buscar-jornada" style="margin: 30px 0; text-align:center;">
        <h3 style="margin-bottom:15px;">¿Qué jornada buscas?</h3>

        <div style="display:inline-flex; align-items:center; gap:10px;">

            <!-- Input con icono y estilo -->
            <div style="position:relative; display:flex; align-items:center;">
                <span style="
                    position:absolute;
                    left:10px;
                    font-size:20px;
                    opacity:0.6;
                ">🔍</span>

                <input id="inputJornadaIndex"
                    type="number"
                    min="1"
                    max="38"
                    placeholder="?"
                    style="
                        padding:10px 15px 10px 35px;
                        font-size:20px;
                        width:120px;
                        text-align:center;
                        border-radius:8px;
                        border:2px solid #888;
                        transition:0.3s;
                    "
                    onfocus="this.style.borderColor='#4da3ff'; this.style.boxShadow='0 0 10px #4da3ff';"
                    onblur="this.style.borderColor='#888'; this.style.boxShadow='none';"
                >
            </div>

            <!-- Botón Aceptar bonito -->
            <button onclick="buscarJornadaIndex()"
                style="
                    padding:10px 25px;
                    font-size:18px;
                    border-radius:8px;
                    background:#4da3ff;
                    color:white;
                    border:none;
                    cursor:pointer;
                    transition:0.3s;
                "
                onmouseover="this.style.background='#1e7fe6';"
                onmouseout="this.style.background='#4da3ff';"
            >
                Aceptar
            </button>

        </div>
    </div>

</section>

<script>
function buscarJornadaIndex() {
    let valor = Number(document.getElementById("inputJornadaIndex").value);

    if (!valor || valor < 1 || valor > 38) {
        alert("Introduce un número entre 1 y 38");
        return;
    }

    // Ir a la página Jornadas.html con la jornada seleccionada
    location.href = `Jornadas.html?id=${valor}`;
}
</script>


        <!-- SECCIÓN CLASIFICACIÓN -->
        <div id="clasificacion" class="seccion">
            <h2>Clasificación</h2>
            <p>Aquí irá la tabla de clasificación.</p>
        </div>

        <!-- SECCIÓN RESULTADOS -->
        <div id="resultados" class="seccion">
            <h2>Resultados</h2>
            <p>Aquí irán los resultados de los partidos.</p>
        </div>

<!-- SECCIÓN ESCRUTADOR -->
<div id="escrutador" class="seccion">

    <!-- CUADRO del ESCRUTADOR -->
    <iframe
        width="600px"

        src="https://1drv.ms/x/c/9e2ad67d77893109/IQRKLS76eZCRQZ54Qma-2pFUAdmMrgJh6S6kH5fDoPp6b0U?em=2&ActiveCell='Escrutador 2.0'!C13&Item='Escrutador 2.0'!C13:AO50&wdHideGridlines=True&wdInConfigurator=True">
    </iframe>
</div>


    </main>

    <script src="script.js"></script>
<script>
function lanzarEstrellaFugaz() {
    const header = document.querySelector("header");

    // Crear estrella
    const estrella = document.createElement("div");
    estrella.classList.add("estrella-fugaz");

    // Posición aleatoria en la parte superior del header
    const startX = Math.random() * window.innerWidth * 0.6; 
    const startY = Math.random() * 40; 

    estrella.style.left = startX + "px";
    estrella.style.top = startY + "px";

    header.appendChild(estrella);

    // Eliminar cuando termine la animación
    estrella.addEventListener("animationend", () => {
        estrella.remove();
    });
}

// Lanzar una cada 4–7 segundos
setInterval(() => {
    if (document.body.classList.contains("dark")) {
        lanzarEstrellaFugaz();
    }
}, 4000 + Math.random() * 3000);
</script>

</body>
</html>
