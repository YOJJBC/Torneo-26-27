<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornadas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark">

    <!-- HEADER -->
    <header>
        <button id="toggle-mode"></button>
        <h1>Temp. 26/27</h1>
    </header>

    <!-- MENÚ (FUNCIONA IGUAL QUE EN INDEX) -->
    <nav>
        <button onclick="location.href='index.html#calendario'">📅 Calendario</button>
        <button onclick="location.href='index.html#jornadas'">🔢 Jornadas</button>
        <button onclick="location.href='index.html#clasificacion'">📊 Clasificación</button>
        <button onclick="location.href='index.html#resultados'">⚽ Resultados</button>
        <button onclick="location.href='index.html#escrutador'">🧮 Escrutador</button>
    </nav>

    <!-- CONTENIDO -->
    <main>

        <!-- BUSCADOR DE JORNADA -->
        <div class="buscar-jornada" style="margin: 20px 0; text-align:center;">
            <h3>¿Qué jornada buscas?</h3>

            <input id="inputJornada" 
                   type="number" 
                   min="1" 
                   max="38" 
                   placeholder="1 - 38"
                   style="padding:10px; font-size:18px; width:120px; text-align:center;">

            <button onclick="buscarJornada()" 
                    style="padding:10px 20px; font-size:18px; margin-left:10px;">
                Aceptar
            </button>
        </div>

        <!-- TÍTULO DE LA JORNADA -->
        <h2 id="titulo"></h2>

        <!-- IFRAME -->
        <iframe id="cuadro" width="1100px" height="1500px"></iframe>

    </main>

    <!-- SCRIPT PARA CARGAR LA JORNADA -->
    <script>
        // Si viene con ?id=XX, cargar directamente la jornada
        const params = new URLSearchParams(window.location.search);
        const id = Number(params.get("id"));

        if (id) {
            cargarJornada(id);
        }

        function buscarJornada() {
            let valor = Number(document.getElementById("inputJornada").value);

            if (!valor || valor < 1 || valor > 38) {
                alert("Introduce un número entre 1 y 38");
                return;
            }

            location.href = `Jornadas.html?id=${valor}`;
        }

        function cargarJornada(id) {
            document.getElementById("titulo").innerText = "Jornada " + id;

            const inicio = (id - 1) * 40 + 1;
            const fin = inicio + 39;

            document.getElementById("cuadro").src =
                `https://1drv.ms/x/c/9e2ad67d77893109/IQRKLS76eZCRQZ54Qma-2pFUAdmMrgJh6S6kH5fDoPp6b0U?em=2&Item='Jornadas'!A${inicio}:Z${fin}&wdHideGridlines=True&wdInConfigurator=True`;
        }
    </script>

    <!-- ESTRELLAS FUGACES -->
    <script>
        function lanzarEstrellaFugaz() {
            const header = document.querySelector("header");
            const estrella = document.createElement("div");
            estrella.classList.add("estrella-fugaz");

            const startX = Math.random() * window.innerWidth * 0.6;
            const startY = Math.random() * 40;

            estrella.style.left = startX + "px";
            estrella.style.top = startY + "px";

            header.appendChild(estrella);

            estrella.addEventListener("animationend", () => estrella.remove());
        }

        setInterval(() => {
            if (document.body.classList.contains("dark")) {
                lanzarEstrellaFugaz();
            }
        }, 4000 + Math.random() * 3000);
    </script>

    <script src="script.js"></script>

</body>
</html>
